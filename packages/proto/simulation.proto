syntax = "proto3";

package moktopus.simulation.v1;

option go_package = "moktopus/packages/sdk-go/simulationv1";

message TrafficConfig {
  int32 duration_seconds = 1;
  int32 requests_per_second = 2;
  int32 max_retries = 3;
  double base_network_latency_ms = 4;
  double retry_penalty_ms = 5;
}

message TopologyNode {
  string id = 1;
  string type = 2;
  map<string, string> config = 3;
}

message TopologyEdge {
  string id = 1;
  string source = 2;
  string target = 3;
}

message Topology {
  repeated TopologyNode nodes = 1;
  repeated TopologyEdge edges = 2;
}

message StartSimulationRequest {
  string project_id = 1;
  Topology topology = 2;
  TrafficConfig traffic = 3;
}

message StartSimulationResponse {
  string run_id = 1;
  string status = 2;
}

message StopSimulationRequest {
  string run_id = 1;
}

message StopSimulationResponse {}

message ReplayRequest {
  string run_id = 1;
}

message ReplayResponse {
  string run_id = 1;
  string status = 2;
}

service SimulationService {
  rpc StartSimulation(StartSimulationRequest) returns (StartSimulationResponse);
  rpc StopSimulation(StopSimulationRequest) returns (StopSimulationResponse);
  rpc Replay(ReplayRequest) returns (ReplayResponse);
}
